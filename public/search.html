<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <title>搜尋結果</title>
    <link rel="stylesheet" href="../src/styles/main.css">
</head>

<body>
    <header class="layout-header">
        <h1>搜尋電子書</h1>
    </header>

    <main class="layout-main">
        <form class="form-group">
            <label for="search-input" class="form-label">輸入關鍵字：</label>
            <input type="text" id="search-input" class="form-input">
            <button class="btn btn-primary">搜尋</button>
        </form>

        <section class="section-results">
            <h2>搜尋結果</h2>
            <div class="card">
                <div class="card-header">電子書標題</div>
                <div class="card-body">簡介內容</div>
                <div class="card-footer">
                    <a href="product.html" class="btn btn-secondary">查看詳目</a>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
